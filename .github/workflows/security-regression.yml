name: Security regression

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/real-estate/**'
      - '.github/workflows/security-regression.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/real-estate/**'
      - '.github/workflows/security-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1634ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/real-estate/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci --ignore-scripts --prefix backend
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --prefix frontend/real-estate
      - name: Typecheck backend and focused security harness
        run: |
          npm run typecheck --prefix backend
          npm run typecheck:security --prefix backend
      - name: Run isolated security regression checks
        run: npm run test:security --prefix backend
      - name: Build backend
        run: npm run build --prefix backend
      - name: Build production frontend
        env:
          API_URL: https://api.example.invalid
          PUBLIC_SITE_URL: https://example.invalid
        run: npm run build --prefix frontend/real-estate
