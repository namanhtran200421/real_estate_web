<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>VN Booking Hub · Căn hộ Sun Garden Đà Lạt</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Căn hộ Sun Garden A04-12 tại Đà Lạt: 78 m², 2 phòng ngủ, 2 phòng tắm và ban công thoáng.">
  <meta name="theme-color" content="#F6F1E8">
  <meta name="format-detection" content="telephone=no">
  <meta property="og:site_name" content="VN Booking Hub">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="vi_VN">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" href="brand/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <!-- The display font, fetched with the page instead of after the CSS is parsed. -->
  <link rel="preload" href="fonts/fraunces-vietnamese-variable.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Motion boot: classes decided before first paint. The server hashes completed inline scripts for CSP. -->
  <script>
    (function () {
      try {
        var q = window.matchMedia, d = document.documentElement;
        if (!q('(prefers-reduced-motion: no-preference)').matches) return;
        d.classList.add('motion');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Outside app-root so the startup screen never changes Angular's hydration tree.
       Hidden unless the boot script runs; server-rendered content stays readable without JS. -->
  <div id="site-loader" class="site-loader" role="status" aria-live="polite" aria-atomic="true" hidden>
    <div class="site-loader__identity">
      <img src="/brand/logo-mark.webp" width="359" height="239" alt="" class="site-loader__mark" aria-hidden="true">
      <p class="site-loader__place" aria-hidden="true">SUN GARDEN · ĐÀ LẠT</p>
      <p class="site-loader__name">VN Booking Hub</p>
      <div class="site-loader__track" aria-hidden="true"><span></span></div>
      <p class="site-loader__message" lang="vi">Đang mở một góc Đà Lạt…</p>
      <p class="site-loader__message" lang="en">Opening a corner of Đà Lạt…</p>
    </div>
  </div>
  <app-root></app-root>
  <script id="site-loading-boot">
    (function () {
      var root = document.querySelector('app-root');
      var loader = document.getElementById('site-loader');
      if (!root || !loader || /^\/(?:en\/)?admin(?:\/|$)/.test(location.pathname)) return;
      var page = document.documentElement;
      page.lang = /^\/en(?:\/|$)/.test(location.pathname) ? 'en' : 'vi';
      var finished = false;
      var minimumElapsed = false;
      var ready = false;
      function blockScroll(event) { event.preventDefault(); }
      function onReady() {
        ready = true;
        if (minimumElapsed) finish();
      }
      function finish() {
        if (finished) return;
        finished = true;
        clearTimeout(showcase);
        clearTimeout(guard);
        // Only a ready page gets the curtain reveal; failures and reduced motion exit directly.
        if (ready && window.matchMedia('(prefers-reduced-motion: no-preference)').matches) {
          page.classList.add('site-entering');
          setTimeout(function () {
            page.classList.remove('site-entering');
            loader.hidden = true;
          }, 1600);
        } else {
          loader.hidden = true;
        }
        page.classList.remove('site-loading');
        root.removeAttribute('inert');
        root.removeAttribute('aria-busy');
        loader.setAttribute('aria-hidden', 'true');
        loader.removeEventListener('wheel', blockScroll);
        window.removeEventListener('vnbooking:ready', onReady);
      }
      // The app and its page assets load underneath a six-second brand showcase.
      var showcase = setTimeout(function () {
        minimumElapsed = true;
        if (ready) finish();
      }, 6000);
      // Independent recovery caps the overlay even if a bundle or image never settles.
      var guard = setTimeout(finish, 7000);
      window.addEventListener('vnbooking:ready', onReady, { once: true });
      loader.addEventListener('wheel', blockScroll, { passive: false });
      loader.hidden = false;
      root.setAttribute('inert', '');
      root.setAttribute('aria-busy', 'true');
      page.classList.add('site-loading');
    })();
  </script>
</body>
</html>
