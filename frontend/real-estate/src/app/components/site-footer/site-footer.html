<footer class="border-t border-border bg-card">
  <div class="container-editorial max-w-6xl py-16 md:py-20">
    <div class="grid gap-12 md:grid-cols-[1fr_auto_minmax(0,20rem)] md:gap-16">
      <div>
        <a routerLink="/" class="inline-block" [attr.aria-label]="site.name + ' · Trang chủ'">
          <img src="brand/logo-stacked.webp" [alt]="site.name" width="500" height="337" loading="lazy" class="h-20 w-auto" />
        </a>
        <p class="mt-4 max-w-sm text-muted-foreground">{{ site.tagline }}</p>
      </div>

      <nav aria-label="Liên kết chân trang">
        <p class="small-caps text-accent-deep">Khám phá</p>
        <ul class="mt-5 space-y-1">
          @for (link of links; track link.path) {
            <li>
              <a
                [routerLink]="link.path"
                class="link-subtle inline-flex min-h-11 items-center"
              >
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
      </nav>

      <div>
        <p class="small-caps text-accent-deep">Liên hệ</p>
        <ul class="mt-5 divide-y divide-border border-y border-border">
          @for (c of site.contact; track c.label) {
            <li>
              <a
                [href]="c.href"
                class="flex min-h-11 items-baseline justify-between gap-4 py-3 transition-colors hover:text-accent-deep"
              >
                <span class="text-sm text-muted-foreground">{{ c.label }}</span>
                <span class="font-serif text-lg">{{ c.value }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    </div>

    <div class="mt-16 flex flex-wrap items-center justify-between gap-4 text-sm text-muted-foreground">
      <p>&copy; {{ year }} {{ site.name }}. Bảo lưu mọi quyền.</p>
      <!-- Owner sign-in; opens the dashboard directly when already signed in. -->
      <a routerLink="/admin" class="link-subtle inline-flex min-h-11 items-center" rel="nofollow">Quản lý</a>
    </div>
  </div>
</footer>
