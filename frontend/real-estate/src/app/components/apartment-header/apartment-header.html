@let apt = apartment();

<!-- The section tabs (Overview, Photos, Location). The apartment page shows the title and price once;
     Gallery and Location only need the tabs. tabsOnly: laid out by the page that embeds them. -->
<div [class]="tabsOnly() ? '' : 'pt-8 md:pt-12'">
  <div [class]="tabsOnly() ? '' : 'container-editorial max-w-6xl'">
    <!-- Underlined tabs on a hairline; scrolls sideways on phones; a right-edge fade hints at more tabs. -->
    <div>
      <nav
        [attr.aria-label]="'apartment.sections' | transloco"
        class="flex max-w-full gap-8 overflow-x-auto border-b border-border [mask-image:linear-gradient(to_right,black_calc(100%-2rem),transparent)] [scrollbar-width:none] sm:gap-10 sm:[mask-image:none] [&::-webkit-scrollbar]:hidden"
      >
        @for (tab of tabs; track tab.path) {
          <a
            [routerLink]="tab.path"
            [queryParams]="{ apt: apt.slug }"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
            ariaCurrentWhenActive="page"
            class="label-caps -outline-offset-2 -mb-px inline-flex min-h-12 shrink-0 items-center border-b-2 border-transparent text-muted-foreground transition-colors hover:text-foreground [&.is-active]:border-foreground [&.is-active]:text-foreground"
          >
            {{ tab.label | transloco }}
          </a>
        }
      </nav>
    </div>
  </div>
</div>
