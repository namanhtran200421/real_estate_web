<header class="sticky top-0 z-40 border-b border-border bg-background/90 backdrop-blur-md">
  <div class="container-editorial flex h-[4.5rem] max-w-6xl items-center gap-4">
    <a routerLink="/" class="shrink-0" [attr.aria-label]="site.name + ' · Trang chủ'" (click)="menuOpen.set(false)">
      <img
        src="brand/logo-horizontal.webp"
        [alt]="site.name"
        width="758"
        height="155"
        fetchpriority="high"
        class="h-8 w-auto sm:h-9 lg:h-10"
      />
    </a>

    <nav aria-label="Điều hướng chính" class="ml-10 hidden items-center gap-8 lg:flex">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          class="nav-link whitespace-nowrap py-1 text-sm font-medium tracking-[0.03em]"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="ml-auto flex items-center gap-3">
      <!-- Search (desktop) -->
      <ng-container *ngTemplateOutlet="search; context: { id: 'site-search' }" />

      <span class="hidden h-5 w-px bg-border lg:block" aria-hidden="true"></span>

      <div class="small-caps hidden items-center sm:flex" role="group" aria-label="Ngôn ngữ">
        <button type="button" aria-pressed="true" class="min-h-11 px-1.5 text-foreground">VI</button>
        <span class="text-border" aria-hidden="true">/</span>
        <button
          type="button"
          aria-pressed="false"
          class="link-subtle min-h-11 px-1.5"
        >
          EN
        </button>
      </div>
      <a
        routerLink="/book"
        queryParamsHandling="preserve"
        class="btn btn-primary px-5 lg:h-10 lg:min-h-10 lg:text-sm"
        (click)="menuOpen.set(false)"
      >
        Đặt lịch
      </a>
      <button
        type="button"
        class="icon-btn lg:hidden"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen() ? 'Đóng menu' : 'Mở menu'"
        (click)="menuOpen.set(!menuOpen())"
      >
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          @if (menuOpen()) {
            <path d="M6 6l12 12M18 6 6 18" stroke-linecap="round" />
          } @else {
            <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" />
          }
        </svg>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav id="mobile-menu" aria-label="Menu" class="border-t border-border bg-background lg:hidden">
      <div class="container-editorial max-w-6xl py-4">
        <ng-container *ngTemplateOutlet="search; context: { id: 'site-search-mobile', mobile: true }" />
        <ul class="mt-2 divide-y divide-border">
          @for (link of links; track link.path) {
            <li>
              <a
                [routerLink]="link.path"
                routerLinkActive="text-accent-deep!"
                [routerLinkActiveOptions]="{ exact: true }"
                ariaCurrentWhenActive="page"
                class="flex min-h-12 items-center font-serif text-lg transition-colors hover:text-accent-deep"
                (click)="menuOpen.set(false)"
              >
                {{ link.label }}
              </a>
            </li>
          }
          <li>
            <a routerLink="/booking/manage" class="flex min-h-12 items-center font-serif text-lg transition-colors hover:text-accent-deep" (click)="menuOpen.set(false)">
              Tra cứu đặt phòng
            </a>
          </li>
          <li class="flex min-h-12 items-center gap-4 sm:hidden">
            <span class="small-caps text-muted-foreground">Ngôn ngữ</span>
            <span class="small-caps flex items-center" role="group" aria-label="Ngôn ngữ">
              <button type="button" aria-pressed="true" class="min-h-11 px-1.5 text-foreground">VI</button>
              <span class="text-border" aria-hidden="true">/</span>
              <button type="button" aria-pressed="false" class="link-subtle min-h-11 px-1.5">EN</button>
            </span>
          </li>
        </ul>
      </div>
    </nav>
  }
</header>

<ng-template #search let-id="id" let-mobile="mobile">
  <form
    role="search"
    class="relative"
    [class]="mobile ? 'block w-full' : 'hidden w-56 lg:block xl:w-72'"
    (submit)="$event.preventDefault()"
  >
    <label [for]="id" class="sr-only">Tìm căn hộ</label>
    <svg
      viewBox="0 0 24 24"
      class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground"
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="6.5" />
      <path d="m20 20-4.2-4.2" stroke-linecap="round" />
    </svg>
    <input
      [id]="id"
      type="search"
      enterkeyhint="search"
      autocomplete="off"
      placeholder="Tìm căn hộ, khu vực…"
      class="input pl-9 text-sm"
      [class]="mobile ? 'h-11 bg-card' : 'h-10 border-transparent bg-muted hover:border-border focus-visible:bg-card'"
    />
  </form>
</ng-template>
