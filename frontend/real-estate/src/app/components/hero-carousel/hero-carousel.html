<div class="absolute inset-0" role="region" aria-roledescription="carousel" [attr.aria-label]="'home.scenes.hero.region' | transloco" (keydown.arrowleft)="previous()" (keydown.arrowright)="next()">
  <div #viewport class="hero-viewport h-full overflow-hidden">
    <div class="flex h-full touch-pan-y">
      @for (photo of slides(); track photo.src; let i = $index) {
        <div
          class="hero-slide relative h-full min-w-0 flex-[0_0_100%]"
          [class.hero-image]="i === 0"
          [class.is-active]="i === index()"
          role="group"
          aria-roledescription="slide"
          [attr.aria-label]="'home.scenes.hero.slide' | transloco: { n: i + 1, total: photos().length }"
          [attr.aria-hidden]="i === index() ? null : 'true'"
        >
          <div class="hero-zoom absolute inset-0">
            @if (i === 0) {
              <img [ngSrc]="photo.src" [alt]="photo.alt" fill priority sizes="100vw" class="object-cover" />
            } @else {
              <img [ngSrc]="photo.src" [alt]="photo.alt" fill sizes="100vw" class="object-cover" />
            }
          </div>
        </div>
      }
    </div>
  </div>
  <!-- A neutral shade (no colour cast) so the copy reads over every photo: light at the top, deeper at the foot. -->
  <div class="pointer-events-none absolute inset-0 bg-[linear-gradient(180deg,rgb(0_0_0/0.25)_0%,rgb(0_0_0/0.32)_40%,rgb(0_0_0/0.72)_100%)]" aria-hidden="true"></div>
</div>
<ng-content />
@if (started()) {
  <!-- Phones: arrows on the left and right edges of the photo, dots along the bottom. Desktop: one group, bottom right. -->
  <button type="button" class="hero-control absolute left-3 top-1/2 z-20 -translate-y-1/2 md:hidden" (click)="previous()" [attr.aria-label]="'apartment.previousPhoto' | transloco">←</button>
  <button type="button" class="hero-control absolute right-3 top-1/2 z-20 -translate-y-1/2 md:hidden" (click)="next()" [attr.aria-label]="'apartment.nextPhoto' | transloco">→</button>
  <div class="absolute inset-x-0 bottom-4 z-20 flex items-center justify-center gap-1 md:inset-x-auto md:bottom-12 md:right-12" role="group" [attr.aria-label]="'home.scenes.hero.controls' | transloco">
    <button type="button" class="hero-control hidden md:inline-grid" (click)="previous()" [attr.aria-label]="'apartment.previousPhoto' | transloco">←</button>
    @for (photo of photos(); track photo.src; let i = $index) {
      <button type="button" class="hero-dot" (click)="goTo(i)" [attr.aria-label]="'home.scenes.hero.slide' | transloco: { n: i + 1, total: photos().length }" [attr.aria-current]="i === index() ? 'true' : null">
        <span class="hero-dot__mark" [class.is-active]="i === index()"></span>
      </button>
    }
    <button type="button" class="hero-control hidden md:inline-grid" (click)="next()" [attr.aria-label]="'apartment.nextPhoto' | transloco">→</button>
  </div>
}
