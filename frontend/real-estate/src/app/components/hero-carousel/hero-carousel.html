<div class="absolute inset-0" role="region" aria-roledescription="carousel" [attr.aria-label]="'home.scenes.hero.region' | transloco" (keydown.arrowleft)="previous()" (keydown.arrowright)="next()">
  <div #viewport class="hero-viewport h-full overflow-hidden">
    <div class="flex h-full touch-pan-y">
      @for (photo of slides(); track photo.src; let i = $index) {
        <div
          class="hero-slide relative h-full min-w-0 flex-[0_0_100%]"
          [class.hero-image]="i === 0"
          [class.is-active]="i === index()"
          role="group"
          aria-roledescription="slide"
          [attr.aria-label]="'home.scenes.hero.slide' | transloco: { n: i + 1, total: photos().length }"
          [attr.aria-hidden]="i === index() ? null : 'true'"
        >
          <div class="hero-zoom absolute inset-0">
            @if (i === 0) {
              <img [ngSrc]="photo.src" [alt]="photo.alt" fill priority sizes="100vw" class="object-cover" />
            } @else {
              <img [ngSrc]="photo.src" [alt]="photo.alt" fill sizes="100vw" class="object-cover" />
            }
          </div>
        </div>
      }
    </div>
  </div>
  <!-- Lighter, warmer shade: clear above the middle, navy at the foot; a second veil sits behind the copy side only. -->
  <div class="hero-scrim pointer-events-none absolute inset-0" aria-hidden="true"></div>
</div>
<ng-content />
@if (started()) {
  <div class="absolute right-4 top-28 z-20 flex items-center gap-1 md:right-12 md:top-auto md:bottom-12" role="group" [attr.aria-label]="'home.scenes.hero.controls' | transloco">
    <button type="button" class="hero-control" (click)="previous()" [attr.aria-label]="'apartment.previousPhoto' | transloco">←</button>
    @for (photo of photos(); track photo.src; let i = $index) {
      <button type="button" class="hero-dot" (click)="goTo(i)" [attr.aria-label]="'home.scenes.hero.slide' | transloco: { n: i + 1, total: photos().length }" [attr.aria-current]="i === index() ? 'true' : null">
        <span class="hero-dot__mark" [class.is-active]="i === index()"></span>
      </button>
    }
    <button type="button" class="hero-control" (click)="next()" [attr.aria-label]="'apartment.nextPhoto' | transloco">→</button>
  </div>
}
