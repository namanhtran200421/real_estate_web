<div #root>
  <button
    #trigger
    type="button"
    role="combobox"
    [id]="inputId()"
    aria-haspopup="listbox"
    [attr.aria-controls]="listboxId()"
    [attr.aria-expanded]="open()"
    [attr.aria-activedescendant]="open() && activeIndex() >= 0 ? optionId(activeIndex()) : null"
    class="input flex items-center justify-between gap-3 text-left"
    [class.border-accent]="open()"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
    (keyup.space)="$event.preventDefault()"
  >
    <span class="truncate" [class.text-muted-foreground]="!selected()">
      {{ selected()?.label ?? placeholder() }}
    </span>
    <svg
      viewBox="0 0 20 20"
      class="h-[1.125rem] w-[1.125rem] shrink-0 transition-[transform,color]"
      [class]="open() ? 'rotate-180 text-accent' : 'text-muted-foreground'"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m6 8 4 4 4-4" />
    </svg>
  </button>

  @if (name()) {
    <input type="hidden" [name]="name()" [value]="value()" />
  }

  @if (open()) {
    <ul
      [id]="listboxId()"
      role="listbox"
      tabindex="-1"
      class="animate-dropdown absolute inset-x-0 top-full z-50 mt-2 max-h-64 overflow-auto rounded-lg border border-border bg-card p-1.5 shadow-lg"
    >
      @for (option of options(); track option.value; let i = $index) {
        <li
          #option
          role="option"
          [id]="optionId(i)"
          [attr.aria-selected]="option.value === value()"
          class="flex cursor-pointer items-center justify-between gap-3 rounded-md px-3 py-2.5 transition-colors"
          [class]="
            (i === activeIndex() ? 'bg-muted ' : '') +
            (option.value === value() ? 'font-medium text-accent' : 'text-foreground')
          "
          (pointerenter)="activeIndex.set(i)"
          (click)="choose(i)"
        >
          <span class="truncate">{{ option.label }}</span>
          @if (option.value === value()) {
            <svg viewBox="0 0 20 20" class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <path d="m4 10.5 4 4 8-9" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
        </li>
      }
    </ul>
  }
</div>
