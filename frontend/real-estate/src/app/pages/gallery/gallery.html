@if (apartment(); as apt) {
  <app-apartment-header [apartment]="apt" />

  <section class="pb-20 pt-10 md:pb-28">
    <div class="container-editorial max-w-6xl">
      <p class="small-caps text-muted-foreground">{{ apt.photos.length }} ảnh</p>

      <div class="mt-6 grid gap-x-6 gap-y-10 sm:grid-cols-2">
        @for (photo of apt.photos; track photo.src; let first = $first) {
          <figure [class]="first ? 'sm:col-span-2' : ''">
            <div
              class="relative overflow-hidden rounded-lg bg-muted shadow-sm"
              [class]="first ? 'aspect-[4/3] sm:aspect-[16/9]' : 'aspect-[4/3]'"
            >
              <img
                [ngSrc]="photo.src"
                [alt]="photo.alt"
                fill
                [priority]="first"
                [sizes]="first ? '100vw' : '(min-width: 640px) 50vw, 100vw'"
                class="object-cover"
              />
            </div>
            <figcaption class="mt-3 text-sm text-muted-foreground">{{ photo.alt }}</figcaption>
          </figure>
        }
      </div>

      <div class="mt-16 flex flex-col items-center gap-5 text-center">
        <span class="rule-accent"></span>
        <p class="font-serif text-2xl">Thích căn hộ này?</p>
        <a routerLink="/book" [queryParams]="{ apt: apt.slug }" class="btn btn-primary">Đặt lịch</a>
      </div>
    </div>
  </section>
} @else {
  <app-apartment-not-found />
}
