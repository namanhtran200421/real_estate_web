@if (apartment(); as apt) {
  <app-apartment-header [apartment]="apt" />

  <!-- Around: the apartment at the centre, journey times to each place. -->
  <section class="section">
    <div class="container-editorial max-w-6xl">
      <p class="label-caps text-accent-deep">{{ 'location.eyebrow' | transloco }}</p>
      <h2 class="display-section mt-4"><app-split [text]="'home.scenes.aroundTitle' | transloco" /></h2>
      <div class="mt-12"><app-route-map [places]="apt.nearby" [label]="'home.scenes.aroundTitle' | transloco" /></div>
    </div>
  </section>

  <!-- The map and the address. -->
  <section class="bg-muted pb-20 pt-4 md:pb-24">
    <div class="container-editorial max-w-6xl">
      <div class="panel grid gap-8 !p-4 md:grid-cols-[1.3fr_0.7fr] md:gap-10 md:!p-6">
        <div class="overflow-hidden rounded-lg bg-muted">
          <!-- Google Maps is heavy: only load it once the map area is on screen. -->
          @defer (on viewport) {
            <iframe
              [title]="'location.mapTitle' | transloco: { name: apt.name }"
              [src]="mapUrl()"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              class="block h-80 w-full md:h-full md:min-h-[28rem]"
            ></iframe>
          } @placeholder {
            <div class="grid h-80 w-full place-items-center md:h-full md:min-h-[28rem]">
              <span class="label-caps text-muted-foreground">{{ 'location.loadingMap' | transloco }}</span>
            </div>
          }
        </div>
        <div class="flex flex-col justify-center md:py-4">
          <p class="label-caps text-accent-deep">{{ 'location.address' | transloco }}</p>
          <p class="mt-3 font-serif text-2xl md:text-3xl">{{ apt.address }}</p>
          <span class="rule-accent mt-6"></span>
          <p class="mt-6 text-sm text-muted-foreground">
            {{ 'location.note' | transloco }}
          </p>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container-editorial max-w-6xl">
      <p class="label-caps text-center text-accent-deep">{{ 'nav.contact' | transloco }}</p>
      <h2 class="display-section mt-4 text-center"><app-split [text]="'location.callUs' | transloco" /></h2>
      <app-contact-cards class="mt-12 block" />
    </div>
  </section>
} @else {
  <app-apartment-not-found />
}
