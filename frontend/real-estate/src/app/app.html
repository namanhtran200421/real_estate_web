@if (inAdmin()) {
  <router-outlet />
} @else {
  <app-site-header />
  <app-custom-cursor />

  <main id="main" tabindex="-1">
    <router-outlet />
  </main>

  <!-- Footer HTML comes from the server; its JS only loads when it scrolls into view. -->
  @defer (hydrate on viewport) {
    <app-site-footer />
  }
}
